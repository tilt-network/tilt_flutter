group = "com.example.tilt"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"  // ⬅️ aqui
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlinx-serialization"  // ⬅️ este é o ID Groovy

//plugins {
//    kotlin("plugin.serialization") version "1.9.0"
//}

android {
    namespace = "com.example.tilt"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Jetpack DataStore Preferences
    implementation "technology.tilt:sdk:0.1.5"
    implementation "androidx.datastore:datastore-preferences:1.1.2"                      //  [oai_citation:0‡commonsware.com](https://commonsware.com/blog/2025/01/15/jetpack-artifacts.html?utm_source=chatgpt.com)
    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"             //  [oai_citation:1‡mvnrepository.com](https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-core?utm_source=chatgpt.com)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"          //  [oai_citation:2‡mvnrepository.com](https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-android/1.10.2?utm_source=chatgpt.com)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2"            //  [oai_citation:3‡mvnrepository.com](https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-guava?utm_source=chatgpt.com)
    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:4.12.0"                                //  [oai_citation:4‡security.snyk.io](https://security.snyk.io/package/maven/com.squareup.okhttp3%3Aokhttp?utm_source=chatgpt.com)
    // HiveMQ MQTT Client
    implementation "com.hivemq:hivemq-mqtt-client:1.3.6"                               //  [oai_citation:5‡central.sonatype.com](https://central.sonatype.com/artifact/com.hivemq/hivemq-mqtt-client?utm_source=chatgpt.com)
    // Kotlinx Serialization JSON
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"            //  [oai_citation:6‡central.sonatype.com](https://central.sonatype.com/artifact/org.jetbrains.kotlinx/kotlinx-serialization-json?utm_source=chatgpt.com)
    // Jetpack JavaScriptEngine
    implementation "androidx.javascriptengine:javascriptengine:1.0.0-alpha07"             //  [oai_citation:7‡developer.android.com](https://developer.android.com/jetpack/androidx/releases/javascriptengine?utm_source=chatgpt.com)
}


